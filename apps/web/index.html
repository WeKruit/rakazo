<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WeKruit Headhunter recruiting workspace." />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="apple-mobile-web-app-title" content="WeKruit Headhunter" />
    <link rel="icon" href="/favicon.ico?v=wk2" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png?v=wk2" type="image/png" sizes="32x32" />
    <link rel="icon" href="/wekruit-icon.svg?v=wk2" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=wk2" />
    <link rel="manifest" href="/site.webmanifest?v=wk2" />
    <title>WeKruit Headhunter</title>
    <script>
      (() => {
        const key = "rakazo.uiAppearance";
        let preference = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "system" || stored === "light" || stored === "dark") preference = stored;
        } catch {}
        const systemLight =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches;
        const theme = preference === "system" ? (systemLight ? "light" : "dark") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#fafaf8" : "#0b0c0e");
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div
        role="status"
        data-rakazo-app-state="module-pending"
        style="position: fixed; inset: 0; display: grid; place-items: center; background: light-dark(#fafaf8, #0b0c0e); color: CanvasText; font: 14px system-ui, sans-serif"
      >
        Loading…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
