<!doctype html>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src about:; child-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<style>html,body{height:100%;margin:0}iframe{width:100%;height:100%;border:0;background:#fff}</style>
<iframe id="preview" title="Preview" sandbox="allow-scripts" referrerpolicy="no-referrer" csp="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; form-action 'none'; base-uri 'none'"></iframe>
<script>
  // A separate document so the app's strict CSP does not apply to previewed HTML.
  addEventListener("message", (event) => {
    if (event.source === parent && typeof event.data === "string")
      document.getElementById("preview").srcdoc = event.data;
  });
</script>
