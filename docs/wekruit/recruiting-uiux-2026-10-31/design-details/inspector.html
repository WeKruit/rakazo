section(body,'滚动关系');if(raw.scrollParent!==undefined)table(body,[['scrollParent',raw.scrollParent]]);const own=(state.data.scrollContainers||[]).filter(s=>s.selector&&s.selector===raw.selector);if(own.length){for(const s of own)table(body,tupleRows(s,['clientWidth','clientHeight','scrollWidth','scrollHeight','scrollLeft','scrollTop','overflowX','overflowY']));}else body.append(element('p','hint','当前节点未与 scrollContainers 的 selector 唯一匹配。下方列出本状态已采集的滚动容器。'));const scrollDetails=element('details');scrollDetails.append(element('summary','', '本状态滚动容器（'+(state.data.scrollContainers?.length||0)+'）'));for(const sc of state.data.scrollContainers||[]){const card=element('div','scroll-card');card.append(element('code','',sc.selector||sc.tag||''),element('p','', 'client '+pretty(sc.clientWidth)+'×'+pretty(sc.clientHeight)+' / scroll '+pretty(sc.scrollWidth)+'×'+pretty(sc.scrollHeight)),element('p','', 'offset '+pretty(sc.scrollLeft)+', '+pretty(sc.scrollTop)+' · overflow '+pretty(sc.overflowX)+' / '+pretty(sc.overflowY)));scrollDetails.append(card);}body.append(scrollDetails);const rawDetails=element('details');rawDetails.style.marginTop='14px';rawDetails.append(element('summary','', '所选节点完整数据'));rawDetails.append(element('pre','raw',JSON.stringify(raw,null,2)));body.append(rawDetails);}
function svgEl(tag,attrs){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));return e;}
function drawBox(raw,color,label,width=2,dashed=false){const r=raw.rect;if(!r||!Number.isFinite(r.x)||!Number.isFinite(r.y)||!rectIntersects(r,viewport().w,viewport().h))return;const group=svgEl('g',{'pointer-events':'none'});group.append(svgEl('rect',{x:r.x,y:r.y,width:r.width,height:r.height,fill:color==='blue'?'#2768e012':'none',stroke:color==='blue'?'#2266dd':color,'stroke-width':width/state.scale,...(dashed?{'stroke-dasharray':(5/state.scale)+' '+(3/state.scale)}:{})}));if(label){const x=Math.max(0,r.x),y=Math.max(0,r.y-22/state.scale),text=svgEl('text',{x:x+5/state.scale,y:y+15/state.scale,fill:'#fff','font-family':'system-ui,sans-serif','font-size':11/state.scale});text.textContent=label;const labelWidth=Math.min(viewport().w-x,(label.length*6.5+12)/state.scale);group.append(svgEl('rect',{x,y,width:labelWidth,height:20/state.scale,fill:'#2266dd',rx:3/state.scale}),text);}$('overlay').append(group);}
function drawOverlay(){const svg=$('overlay'),vp=viewport();svg.replaceChildren();svg.setAttribute('viewBox','0 0 '+vp.w+' '+vp.h);svg.setAttribute('preserveAspectRatio','none');if(!state.imageOk)return;if($('structures').checked){const seen=new Set();const structures=(state.data.elements||[]).filter(e=>e.inViewport===true&&e.occludedAtCenter!==true&&e.rect&&e.rect.width*e.rect.height>vp.w*vp.h*.035&&e.rect.width*e.rect.height<vp.w*vp.h*.94).sort((a,b)=>b.rect.width*b.rect.height-a.rect.width*a.rect.height).filter(e=>{const key=[e.rect.x,e.rect.y,e.rect.width,e.rect.height].map(Math.round).join(',');if(seen.has(key))return false;seen.add(key);return true;}).slice(0,8);for(const raw of structures)drawBox(raw,'#d28a29',null,1,true);}if(state.selected)drawBox(state.selected.raw,'blue',nodeId(state.selected)+' · '+fmt(state.selected.raw.rect?.width)+' × '+fmt(state.selected.raw.rect?.height));}
function resizeStage(){if(!state.data)return;const vp=viewport(),scroll=$('canvas-scroll');let scale=$('zoom').value==='fit'?Math.max(.1,(scroll.clientWidth-44)/vp.w):Number($('zoom').value);state.scale=scale;$('stage').style.width=vp.w*scale+'px';$('stage').style.height=vp.h*scale+'px';$('scale-label').textContent=fmt(scale*100)+'% · 原始 '+vp.w+'×'+vp.h;drawOverlay();syncHeight();}
async function loadState(id,wantedNode){const revision=++state.revision;const entry=state.manifest.find(e=>e.id===id)||state.manifest[0];if(!entry)return;state.entry=entry;state.selected=null;state.data=null;state.imageOk=false;$('state').value=entry.id;$('status').replaceChildren(element('span','', '正在读取 '+entry.id+'…'));$('nodes').replaceChildren(element('p','loading','读取组件数据…'));showMessage('正在载入测量…');$('stage').hidden=true;$('canvas-empty').hidden=false;$('canvas-empty').textContent='正在载入布局图…';try{const response=await fetch(safePath(entry.json,'states/'+entry.id+'.json'),{cache:'no-store'});if(!response.ok)throw new Error('JSON HTTP '+response.status);const data=await response.json();if(revision!==state.revision)return;if(!Array.isArray(data.elements))throw new Error('测量数据缺少 elements 数组。');state.data=data;updateHeader();$('mode-t').textContent='T 文字 / 图标'+(data.textAndIcons?.samples?.length?'':' · 未采');$('mode-e').setAttribute('aria-pressed',String(state.mode==='E'));$('mode-t').setAttribute('aria-pressed',String(state.mode==='T'));renderList();const img=$('shot');img.onload=()=>{if(revision!==state.revision)return;const vp=viewport();state.imageOk=Math.abs(img.naturalWidth/img.naturalHeight-vp.w/vp.h)<.012;$('canvas-empty').hidden=true;$('stage').hidden=false;if(!state.imageOk){$('status').append(element('span','warning','布局图纵横比与测量视口不匹配，已停用坐标框。'));}resizeStage();};img.onerror=()=>{if(revision!==state.revision)return;$('canvas-empty').hidden=false;$('canvas-empty').textContent='布局图读取失败；JSON 仍可检查。';$('stage').hidden=true;};img.alt=entryLabel(entry)+' 匿名化测量布局图';img.src=safePath(entry.screenshot,'screenshots/'+entry.id+'.jpg');const target=wantedNode?.match(/^([ET])(\d+)$/i);if(target){state.mode=target[1].toUpperCase();const n=allNodes().find(n=>n.index===Number(target[2]));if(n){$('mode-e').setAttribute('aria-pressed',String(state.mode==='E'));$('mode-t').setAttribute('aria-pressed',String(state.mode==='T'));selectNode(n);}else renderList();}else showMessage('选择左侧节点，或点击布局图定位最小的可见组件。布局图中的网站是静态证据，按钮不会执行原站业务动作。');updateHash();}catch(error){if(revision!==state.revision)return;$('status').replaceChildren(element('span','error','读取失败：'+error.message));$('nodes').replaceChildren();showMessage('测量未载入。请刷新索引或选择其他状态。','error');$('canvas-empty').textContent='当前状态读取失败。';}}
async function loadManifest(){const prior=state.entry?.id,requested=new URLSearchParams(location.hash.slice(1));$('reload').disabled=true;try{const response=await fetch('manifest.json',{cache:'no-store'});if(!response.ok)throw new Error('索引 HTTP '+response.status);const raw=await response.json();const entries=Array.isArray(raw)?raw:raw.states||raw.entries||[];state.manifest=entries.filter(e=>e&&typeof e.id==='string');if(!state.manifest.length)throw new Error('索引中没有页面状态。');const options=document.createDocumentFragment();const groups=new Map();for(const e of state.manifest){const product=e.id.startsWith('metix')?'Metix':'Juicebox';if(!groups.has(product)){const g=document.createElement('optgroup');g.label=product;groups.set(product,g);options.append(g);}const o=document.createElement('option');o.value=e.id;o.textContent=entryLabel(e);groups.get(product).append(o);}$('state').replaceChildren(options);await loadState(prior||requested.get('state'),requested.get('node'));}catch(error){$('status').replaceChildren(element('span','error','索引读取失败：'+error.message+'。请通过本地 HTTP 服务打开此页，并确认 manifest.json 存在。'));$('canvas-empty').textContent='没有可用测量数据。';}finally{$('reload').disabled=false;syncHeight();}}
function setMode(mode){state.mode=mode;state.selected=null;$('mode-e').setAttribute('aria-pressed',String(mode==='E'));$('mode-t').setAttribute('aria-pressed',String(mode==='T'));$('search').placeholder=mode==='T'?'搜索文字、SVG、T 索引…':'搜索 label、selector、E 索引…';renderList();renderDetail();drawOverlay();updateHash();}
$('state').addEventListener('change',()=>loadState($('state').value));$('reload').addEventListener('click',loadManifest);$('zoom').addEventListener('change',resizeStage);$('structures').addEventListener('change',drawOverlay);$('mode-e').addEventListener('click',()=>setMode('E'));$('mode-t').addEventListener('click',()=>setMode('T'));for(const id of['search','show-occluded','show-outside'])$(id).addEventListener('input',renderList);$('overlay').addEventListener('click',event=>{if(!state.imageOk)return;const vp=viewport(),point=localPoint(event.clientX,event.clientY,$('overlay').getBoundingClientRect(),vp.w,vp.h);const candidates=allNodes().filter(n=>vis(n)&&!occluded(n)&&contains(n.raw.rect,point.x,point.y)).sort((a,b)=>a.raw.rect.width*a.raw.rect.height-b.raw.rect.width*b.raw.rect.height);if(candidates.length){selectNode(candidates[0]);$('nodes').querySelector('[data-node="'+nodeId(candidates[0])+'"]')?.scrollIntoView({block:'nearest'});}});$('nodes').addEventListener('keydown',event=>{if(!['ArrowDown','ArrowUp'].includes(event.key))return;const options=[...$('nodes').querySelectorAll('button.node')];const current=options.indexOf(document.activeElement);if(current<0)return;event.preventDefault();options[Math.max(0,Math.min(options.length-1,current+(event.key==='ArrowDown'?1:-1)))].focus();});new ResizeObserver(resizeStage).observe($('canvas-scroll'));

function selfCheck(){const assert=(ok,message)=>{if(!ok)throw new Error('查看器自检失败：'+message);};assert(rectIntersects({x:-10,y:10,width:20,height:20},100,100),'partially visible');assert(!rectIntersects({x:100,y:0,width:10,height:10},100,100),'right edge outside');const p=localPoint(170,95,{left:20,top:20,width:300,height:150},600,300);assert(p.x===300&&p.y===150,'zoom coordinate conversion');assert(contains({x:280,y:130,width:40,height:40},p.x,p.y),'selected rect');assert(!contains({x:0,y:0,width:5,height:5},p.x,p.y),'unrelated rect');return 5;}selfCheck();loadManifest();
