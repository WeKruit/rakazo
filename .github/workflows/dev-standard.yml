name: dev-standard
run-name: development standard ${{ inputs.pr && format('PR {0}', inputs.pr) || github.event.pull_request.number }}
# The development standard in AGENTS.md, checked for a PR. Needs only git and Node.
# PRs opened by the agent integration don't start pull_request workflows here, so the thread that
# owns a PR dispatches this next to its unit-shards run (inputs.pr) before merging to stage.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dev-standard-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Development standard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the PR against the standard
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json body,baseRefOid,headRefOid > "$RUNNER_TEMP/pr.json"
          node -e 'const p=require(process.argv[1]); require("fs").writeFileSync(process.argv[2], p.body ?? "")' \
            "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/pr-body.md"
          base=$(node -p 'require(process.argv[1]).baseRefOid' "$RUNNER_TEMP/pr.json")
          head=$(node -p 'require(process.argv[1]).headRefOid' "$RUNNER_TEMP/pr.json")
          git fetch -q origin "$head" "$base"
          node scripts/check-dev-standard.mjs --base "$base" --head "$head" \
            --body-file "$RUNNER_TEMP/pr-body.md"
